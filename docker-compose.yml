services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: pallies
      POSTGRES_PASSWORD: pallies
      POSTGRES_DB: pallies_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pallies"]
      interval: 5s
      timeout: 5s
      retries: 5
